#############################################################################################################
#                                                                                                           #
# 为了减少重复配置，本配置文件为此sa-admin的独有配置，更多配置请查看 sa-base 项目中的 sa-base.yaml 通用配置文件。      #
# 其中此文件中配置可以覆盖 sa-base.yaml 中的通用配置，具体实现类请看类：YamlProcessor.java                          #
#                                                                                                           #
#############################################################################################################

# 项目配置: 名称、日志目录
project:
  name: sa-admin
  log-directory: ${localPath:/home}/logs/smart_admin_v3/${project.name}/${spring.profiles.active}

# 项目端口和url根路径
server:
  port: 1024
  servlet:
    context-path: /

# CRUD 事件配置（不发送事件的表名列表）
crud-event:
  enabled: true
  exclude-table-names:
    # ====== 用户/权限管理 ======
    - t_employee
    - t_menu
    - t_role
    - t_role_menu
    - t_role_employee
    - t_department
    - t_position
    # ====== 系统支撑 ======
    - t_operate_log
    - t_data_tracer

# 环境
spring:
  profiles:
    active: '@profiles.active@'